<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Algo salió mal — Viraliza</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#09090B;color:#F0EDE5;font-family:"Jost",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:40px 24px}
.wrap{max-width:480px}
.logo{font-family:"Playfair Display",serif;font-size:22px;color:#F0EDE5;text-decoration:none;display:block;margin-bottom:60px}
.logo span{color:#D6B25E}
.icono{font-size:56px;margin-bottom:28px}
.eyebrow{font-size:10px;letter-spacing:4px;text-transform:uppercase;color:#D6B25E;margin-bottom:16px;display:block}
h1{font-family:"Playfair Display",serif;font-size:36px;margin-bottom:16px;line-height:1.2}
h1 em{font-style:italic;color:#D6B25E}
p{color:#8A8480;font-size:15px;line-height:1.8;margin-bottom:36px;font-weight:300}
.btn{display:inline-block;background:#D6B25E;color:#09090B;font-family:"Jost",sans-serif;font-size:11px;font-weight:700;letter-spacing:3px;text-transform:uppercase;text-decoration:none;padding:16px 36px;margin-bottom:14px}
.btn-outline{display:inline-block;border:1px solid rgba(214,178,94,.3);color:#D6B25E;font-family:"Jost",sans-serif;font-size:11px;letter-spacing:2px;text-transform:uppercase;text-decoration:none;padding:14px 28px}
.btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.linea{width:1px;height:60px;background:linear-gradient(to bottom,transparent,rgba(214,178,94,.3),transparent);margin:40px auto}
</style>
</head>
<body>
<div class="wrap">
  <a class="logo" href="/">Viraliza<span>.</span></a>
  <div class="icono">⚡</div>
  <span class="eyebrow">Error inesperado</span>
  <h1>Algo salió<br><em>temporalmente</em> mal</h1>
  <p>Nuestro equipo ya fue notificado. Esto suele resolverse en minutos. Intenta de nuevo o vuelve al inicio.</p>
  <div class="btns">
    <a href="javascript:history.back()" class="btn">← Volver atrás</a>
    <a href="/panel.html" class="btn-outline">Ir al panel</a>
  </div>
  <div class="linea"></div>
  <p style="font-size:13px">¿El problema persiste? Escríbenos a <a href="mailto:hola@viralizacol.com" style="color:#D6B25E">hola@viralizacol.com</a></p>
</div>
</body>
</html>
