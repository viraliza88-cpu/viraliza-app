<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pago completado — Viraliza</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Jost:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#08080B;color:#EDEAE2;font-family:'Jost',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.logo{font-family:'Playfair Display',serif;font-size:26px;color:#EDEAE2;text-decoration:none;margin-bottom:48px;display:block}
.logo span{color:#D6B25E}
.icono{width:72px;height:72px;border-radius:50%;background:rgba(105,240,174,.1);border:1px solid rgba(105,240,174,.3);display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto 28px}
h1{font-family:'Playfair Display',serif;font-size:32px;margin-bottom:12px;line-height:1.2}
h1 em{color:#D6B25E;font-style:italic}
.sub{font-size:15px;color:rgba(255,255,255,.5);line-height:1.7;margin-bottom:40px;max-width:420px}
.plan-box{background:#0F0F13;border:1px solid rgba(214,178,94,.2);padding:24px 32px;margin-bottom:40px;max-width:420px;width:100%}
.plan-label{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:rgba(214,178,94,.6);margin-bottom:8px}
.plan-nombre{font-family:'Playfair Display',serif;font-size:28px;color:#D6B25E;margin-bottom:16px}
.features{list-style:none;text-align:left}
.features li{font-size:13px;color:rgba(255,255,255,.6);padding:6px 0;border-bottom:1px solid rgba(255,255,255,.05);display:flex;align-items:center;gap:10px}
.features li:last-child{border-bottom:none}
.features li::before{content:"✓";color:#D6B25E;font-size:12px;flex-shrink:0}
.btn-gold{background:#D6B25E;color:#08080B;text-decoration:none;padding:16px 40px;font-size:11px;font-weight:700;letter-spacing:3px;text-transform:uppercase;display:inline-block;margin-bottom:16px}
.btn-line{background:none;border:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.5);text-decoration:none;padding:14px 32px;font-size:11px;letter-spacing:2px;text-transform:uppercase;display:inline-block}
.btns{display:flex;flex-direction:column;align-items:center;gap:10px}
.confetti{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0}
.content{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center}
</style>
</head>
<body>
<canvas class="confetti" id="confetti"></canvas>
<div class="content">
  <a class="logo" href="panel.html">Viraliza<span>.</span></a>
  <div class="icono">✓</div>
  <h1>¡Tu plan está <em>activo!</em></h1>
  <p class="sub" id="subtitulo">Tu membresía fue activada exitosamente. Ya puedes producir todos tus videos.</p>

  <div class="plan-box" id="plan-box" style="display:none">
    <div class="plan-label">Tu nuevo plan</div>
    <div class="plan-nombre" id="plan-nombre">—</div>
    <ul class="features" id="plan-features"></ul>
  </div>

  <div class="btns">
    <a class="btn-gold" href="panel.html">Ir a producir mi video →</a>
    <a class="btn-line" href="panel.html#membresia">Ver mi membresía</a>
  </div>
</div>

<script>
// Leer plan de la URL
const params = new URLSearchParams(location.search);
const ref = params.get('ref') || params.get('reference') || '';

const FEATURES = {
  esencial:    ['15 videos al mes','Voces profesionales','Sin marca de agua','Buscador de imágenes','Tu propia narración'],
  signature:   ['50 videos al mes','Voces profesionales','Sin marca de agua','Transiciones cinematográficas','Tu propia narración'],
  elite:       ['150 videos al mes','Voces profesionales','Sin marca de agua','Transiciones cinematográficas','Producción máxima'],
  profesional: ['3 videos profesionales/mes','Capturas reales de tu negocio','Versión 9:16 + 16:9','Producción profesional','Revisión incluida'],
};

async function cargarPlan() {
  try {
    const r = await fetch('/api/yo', { headers: { Authorization: 'Bearer ' + localStorage.getItem('viraliza_token') } });
    const d = await r.json();
    const plan = d?.cuota?.plan?.toLowerCase();
    if (plan && plan !== 'inicial') {
      document.getElementById('plan-nombre').textContent = d.cuota.plan;
      const features = FEATURES[plan] || [];
      document.getElementById('plan-features').innerHTML = features.map(f => `<li>${f}</li>`).join('');
      document.getElementById('plan-box').style.display = 'block';
    }
  } catch(e) {}
}
cargarPlan();

// Confetti
(function() {
  const canvas = document.getElementById('confetti');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const colores = ['#D6B25E','#F0EDE5','#69F0AE','rgba(214,178,94,.5)'];
  const particulas = Array.from({length: 80}, () => ({
    x: Math.random() * canvas.width,
    y: Math.random() * -canvas.height,
    r: Math.random() * 6 + 2,
    color: colores[Math.floor(Math.random() * colores.length)],
    speed: Math.random() * 3 + 1,
    swing: Math.random() * 2 - 1,
    angle: Math.random() * 360,
  }));
  function animar() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particulas.forEach(p => {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.angle * Math.PI / 180);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.r/2, -p.r/2, p.r, p.r * 2);
      ctx.restore();
      p.y += p.speed;
      p.x += p.swing;
      p.angle += 2;
      if (p.y > canvas.height) { p.y = -10; p.x = Math.random() * canvas.width; }
    });
    requestAnimationFrame(animar);
  }
  animar();
  // Parar confetti después de 4 segundos
  setTimeout(() => {
    particulas.forEach(p => p.speed = 0);
    setTimeout(() => ctx.clearRect(0, 0, canvas.width, canvas.height), 1000);
  }, 4000);
})();

// Redirigir al panel después de 8 segundos si no hace clic
setTimeout(() => { location.href = 'panel.html'; }, 8000);
</script>
</body>
</html>
