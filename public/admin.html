<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Administración — Viraliza</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilos.css">
<style>
  .tabla-admin{width:100%;border-collapse:collapse;font-size:14.5px}
  .tabla-admin th{text-align:left;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);padding:12px 14px;border-bottom:1px solid var(--line)}
  .tabla-admin td{padding:14px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
  .tabla-admin select{margin:0;padding:8px 10px;font-size:13px;width:auto}
  .badge-admin{display:inline-block;font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold);border:1px solid var(--line);padding:3px 9px;margin-left:8px}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <a class="logo" href="panel.html">Viraliza<i>.</i></a>
    <div class="sesion">
      <span>Administración<span class="badge-admin">Admin</span></span>
      <a href="panel.html" style="color:var(--muted);font-size:12px;letter-spacing:1.5px;text-transform:uppercase">Volver al panel</a>
      <button class="salir" id="salir" type="button">Salir</button>
    </div>
  </div>
</header>

<main class="panel">
  <div class="wrap">
    <span class="eyebrow">Panel interno</span>
    <h1 class="serif" style="font-size:clamp(24px,3.2vw,32px);margin-bottom:30px">Usuarios de <em>Viraliza</em></h1>

    <p class="msg" id="mensaje"></p>

    <div class="card" style="overflow-x:auto;padding:0">
      <table class="tabla-admin">
        <thead>
          <tr>
            <th>Usuario</th>
            <th>Correo</th>
            <th>Membresía</th>
            <th>Videos (mes / total)</th>
            <th>Desde</th>
          </tr>
        </thead>
        <tbody id="cuerpo-tabla">
          <tr><td colspan="5" style="text-align:center;color:var(--muted);padding:40px">Cargando usuarios…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</main>

<script src="app.js"></script>
<script>Admin.iniciar();</script>
</body>
</html>
